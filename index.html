
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080910">
<title>MERKS — Messenger</title>
<style>
:root{
  --bg:#080910;--panel:#10121d;--panel2:#171a28;--border:#292d40;
  --text:#f4f5ff;--muted:#9298ad;--accent:#8c75ff;--accent2:#5b48d6;
  --bubble:#202438;--mine:#5143a4;--danger:#ff657d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.screen{min-height:100vh}
.center{display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:min(430px,100%);background:#10121deF;border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:0 25px 90px #0009;backdrop-filter:blur(15px)}
.brand{text-align:center;margin-bottom:24px}
.raven{width:72px;height:72px;margin:auto auto 8px;display:block}
.brand h1{letter-spacing:9px;margin:4px 0;font-size:28px}
.brand p{color:var(--muted);font-size:13px}
.field{margin:14px 0}
.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
.field input,.field textarea,.search-input{
  width:100%;padding:14px 15px;background:#090b13;border:1px solid var(--border);
  border-radius:12px;color:var(--text);outline:none
}
.field input:focus,.field textarea:focus,.search-input:focus{border-color:var(--accent)}
.primary,.secondary,.danger-btn{
  border:0;border-radius:12px;padding:13px 17px;font-weight:700
}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.danger-btn{background:#542333;color:#ffb4c0}
.full{width:100%}
.auth-switch{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
.link{color:#b7aaff;cursor:pointer}
.error{color:#ff8294;font-size:12px;min-height:18px;margin-top:8px}
.app{height:100vh;min-height:520px;display:flex;background:#090b13}
.sidebar{width:350px;min-width:290px;background:#10121d;border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-head{padding:17px 17px 12px;border-bottom:1px solid var(--border)}
.side-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}
.logo-mini{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:4px}
.logo-mini svg{width:32px;height:32px}
.icon-btn{width:38px;height:38px;border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:12px}
.icon-btn:hover,.secondary:hover{border-color:var(--accent)}
.search-input{padding:12px 14px}
.chat-list{overflow:auto;flex:1;padding:8px}
.chat-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;cursor:pointer}
.chat-item:hover,.chat-item.active{background:#202337}
.avatar{width:46px;height:46px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#7561d8,#252b55);font-weight:800;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.chat-info{min-width:0;flex:1}
.chat-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-preview{font-size:12px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:10px;color:var(--muted);align-self:flex-start}
.side-bottom{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px}
.side-bottom button{flex:1}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.welcome{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:20px}
.welcome .raven{width:110px;height:110px;opacity:.8}
.conversation{height:100%;display:flex;flex-direction:column;min-height:0}
.chat-header{height:72px;padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:#10121deF}
.header-info{flex:1;min-width:0}
.header-info strong{display:block}
.header-info small{color:var(--muted)}
.header-actions{display:flex;gap:7px}
.messages{flex:1;overflow:auto;padding:22px clamp(12px,5vw,70px);display:flex;flex-direction:column;gap:10px}
.message{max-width:min(72%,560px);padding:11px 14px;border-radius:16px;background:var(--bubble);align-self:flex-start;overflow-wrap:anywhere}
.message.mine{background:var(--mine);align-self:flex-end;border-bottom-right-radius:5px}
.message small{display:block;text-align:right;color:#d0c9ff;font-size:10px;margin-top:6px}
.message audio{max-width:100%;width:230px}
.composer{padding:13px 18px;border-top:1px solid var(--border);display:flex;gap:9px;align-items:center;background:#10121d}
.composer input{flex:1;min-width:0;background:#090b13;border:1px solid var(--border);border-radius:14px;padding:14px;color:white;outline:none}
.send-btn{height:46px;min-width:48px}
.recording{color:#ff7188;font-size:12px;align-self:center}
.modal-bg{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}
.modal{width:min(440px,100%);max-height:90vh;overflow:auto;background:#111421;border:1px solid var(--border);border-radius:20px;padding:22px;box-shadow:0 20px 80px #0009}
.modal h2{margin:0 0 18px}
.modal-actions{display:flex;gap:9px;margin-top:18px}
.modal-actions>*{flex:1}
.profile-avatar{width:90px;height:90px;margin:0 auto 15px}
.profile-center{text-align:center}
.profile-center h2{margin:5px 0}
.muted{color:var(--muted);font-size:13px}
.user-result{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border)}
.user-result .grow{flex:1;min-width:0}
.mobile-back{display:none}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#25283b;border:1px solid var(--border);padding:12px 18px;border-radius:12px;z-index:40;font-size:13px;box-shadow:0 10px 40px #0008}
@media(max-width:720px){
 .sidebar{width:100%;min-width:0}
 .main{display:none}
 .app.chat-open .sidebar{display:none}
 .app.chat-open .main{display:flex;width:100%}
 .mobile-back{display:inline-grid}
 .chat-header{padding:8px 10px}
 .messages{padding:16px 12px}
 .message{max-width:85%}
 .header-actions .icon-btn{width:34px;height:34px}
}
</style>
</head>
<body>
<canvas id="stars"></canvas>

<!-- ЛОГОТИП -->
<svg width="0" height="0" style="position:absolute">
<symbol id="raven-symbol" viewBox="0 0 100 100">
 <path fill="white" d="M8 15 42 34 57 8 60 34 94 19 73 48 96 54 65 63 84 88 53 72 39 96 39 67 8 79 29 55 5 43 37 44Z"/>
 <path fill="#080910" d="M57 43 91 24 69 49 88 55 60 59Z"/>
 <circle cx="61" cy="43" r="2.7" fill="#080910"/>
</symbol>
</svg>

<!-- РЕГИСТРАЦИЯ И ВХОД -->
<section id="authScreen" class="screen center">
 <div class="auth-card">
  <div class="brand">
   <svg class="raven"><use href="#raven-symbol"/></svg>
   <h1>MERKS</h1>
   <p>Твоя связь. Твои правила.</p>
  </div>
  <div id="loginForm">
   <h2>С возвращением</h2>
   <div class="field"><label>Номер телефона</label><input id="loginPhone" placeholder="+380..." autocomplete="tel"></div>
   <div class="field"><label>Пароль</label><input id="loginPassword" type="password" placeholder="Твой пароль"></div>
   <div id="loginError" class="error"></div>
   <button class="primary full" onclick="login()">Войти в MERKS</button>
   <div class="auth-switch">Нет аккаунта? <span class="link" onclick="showRegister()">Создать аккаунт</span></div>
  </div>
  <div id="registerForm" class="hidden">
   <h2>Создать аккаунт</h2>
   <div class="field"><label>Имя профиля</label><input id="regName" placeholder="Как тебя называть"></div>
   <div class="field"><label>Номер телефона</label><input id="regPhone" placeholder="+380..." autocomplete="tel"></div>
   <div class="field"><label>Пароль</label><input id="regPassword" type="password" placeholder="Минимум 6 символов"></div>
   <div class="field"><label>Повтори пароль</label><input id="regPassword2" type="password" placeholder="Повтори пароль"></div>
   <div class="field"><label>Код подтверждения (демо)</label><input id="regCode" placeholder="Введи 1234"></div>
   <div id="registerError" class="error"></div>
   <button class="primary full" onclick="register()">Зарегистрироваться</button>
   <div class="auth-switch">Уже есть аккаунт? <span class="link" onclick="showLogin()">Войти</span></div>
  </div>
 </div>
</section>

<!-- ПРИЛОЖЕНИЕ -->
<section id="appScreen" class="screen hidden">
 <div class="app" id="appLayout">
  <aside class="sidebar">
   <div class="side-head">
    <div class="side-top">
     <div class="logo-mini"><svg><use href="#raven-symbol"/></svg> MERKS</div>
     <button class="icon-btn" title="Создать группу" onclick="openGroupModal()">＋</button>
    </div>
    <input class="search-input" id="chatSearch" placeholder="Поиск чатов..." oninput="renderChats()">
   </div>
   <div class="chat-list" id="chatList"></div>
   <div class="side-bottom">
    <button class="secondary" onclick="openSearch()">⌕ Поиск людей</button>
    <button class="secondary" onclick="openProfile()">Профиль</button>
   </div>
  </aside>

  <main class="main">
   <div class="welcome" id="welcome">
    <div><svg class="raven"><use href="#raven-symbol"/></svg><h2>Добро пожаловать в MERKS</h2><p>Выбери чат или найди собеседника</p></div>
   </div>
   <div class="conversation hidden" id="conversation">
    <header class="chat-header">
     <button class="icon-btn mobile-back" onclick="closeMobileChat()">‹</button>
     <div class="avatar" id="headerAvatar">M</div>
     <div class="header-info"><strong id="headerName">Чат</strong><small id="headerStatus">MERKS</small></div>
     <div class="header-actions">
      <button class="icon-btn" title="Голосовой звонок" onclick="startCall('audio')">☎</button>
      <button class="icon-btn" title="Видеозвонок" onclick="startCall('video')">▣</button>
      <button class="icon-btn" title="Профиль" onclick="openCurrentChatProfile()">ⓘ</button>
     </div>
    </header>
    <div class="messages" id="messages"></div>
    <div class="composer">
     <button class="icon-btn" title="Эмодзи" onclick="addEmoji()">☺</button>
     <input id="messageInput" placeholder="Написать сообщение..." onkeydown="if(event.key==='Enter')sendMessage()">
     <span id="recordingLabel" class="recording hidden">● Запись...</span>
     <button class="icon-btn" id="voiceButton" title="Записать голосовое" onclick="toggleRecording()">🎙</button>
     <button class="primary send-btn" onclick="sendMessage()">➤</button>
    </div>
   </div>
  </main>
 </div>
</section>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="modalBg" class="modal-bg hidden" onclick="if(event.target===this)closeModal()">
 <div class="modal" id="modalContent"></div>
</div>
<div id="toast" class="toast hidden"></div>

<script>
/* ЗВЁЗДНЫЙ ФОН */
const canvas=document.getElementById('stars'),ctx=canvas.getContext('2d');
let stars=[];
function resizeStars(){
 canvas.width=innerWidth*devicePixelRatio;
 canvas.height=innerHeight*devicePixelRatio;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 stars=Array.from({length:150},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.3,a:Math.random(),s:Math.random()*.012+.002}));
}
function animateStars(){
 ctx.clearRect(0,0,innerWidth,innerHeight);
 for(const s of stars){
  s.a+=s.s;if(s.a>1||s.a<.15)s.s*=-1;
  ctx.globalAlpha=s.a;ctx.fillStyle='white';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;requestAnimationFrame(animateStars);
}
addEventListener('resize',resizeStars);resizeStars();animateStars();

/* ДАННЫЕ */
const ACCOUNTS_KEY='merks_accounts';
const SESSION_KEY='merks_current';
const CHATS_KEY='merks_chats';
let currentUser=null,currentChatId=null,recorder=null,recordedChunks=[];
let accounts=read(ACCOUNTS_KEY,[]);
let chats=read(CHATS_KEY,[]);

function read(key,fallback){
 try{return JSON.parse(localStorage.getItem(key))||fallback}catch(e){return fallback}
}
function saveAll(){
 localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(accounts));
 localStorage.setItem(CHATS_KEY,JSON.stringify(chats));
}
function safe(text){
 return String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function makeId(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function avatarText(name){return (name||'M').trim().charAt(0).toUpperCase()}
function timeText(t){return new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function toast(text){
 const el=document.getElementById('toast');el.textContent=text;el.classList.remove('hidden');
 clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),2600);
}

/* АВТОРИЗАЦИЯ */
function showRegister(){
 loginForm.classList.add('hidden');registerForm.classList.remove('hidden');
}
function showLogin(){
 registerForm.classList.add('hidden');loginForm.classList.remove('hidden');
}
async function hashPassword(password){
 const bytes=new TextEncoder().encode(password);
 const hash=await crypto.subtle.digest('SHA-256',bytes);
 return Array.from(new Uint8Array(hash)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
async function register(){
 const name=regName.value.trim(),phone=regPhone.value.trim();
 const pass=regPassword.value,pass2=regPassword2.value,code=regCode.value.trim();
 registerError.textContent='';
 if(!name||!phone||!pass){registerError.textContent='Заполни все поля.';return}
 if(pass.length<6){registerError.textContent='Пароль должен содержать минимум 6 символов.';return}
 if(pass!==pass2){registerError.textContent='Пароли не совпадают.';return}
 if(code!=='1234'){registerError.textContent='Для демо введи код 1234.';return}
 if(accounts.some(a=>a.phone===phone)){registerError.textContent='Этот номер уже зарегистрирован в этом браузере.';return}
 const user={id:makeId(),name,phone,password:await hashPassword(pass),bio:'Пользователь MERKS',avatar:'',created:Date.now()};
 accounts.push(user);saveAll();enterApp(user);
}
async function login(){
 const phone=loginPhone.value.trim(),pass=loginPassword.value;
 loginError.textContent='';
 const user=accounts.find(a=>a.phone===phone);
 if(!user||user.password!==await hashPassword(pass)){loginError.textContent='Неверный номер или пароль.';return}
 enterApp(user);
}
function enterApp(user){
 currentUser=user;
 localStorage.setItem(SESSION_KEY,user.id);
 appScreen.classList.remove('hidden');authScreen.classList.add('hidden');
 chats=read(CHATS_KEY,[]);
 renderChats();
 showEmpty();
}
function logout(){
 localStorage.removeItem(SESSION_KEY);currentUser=null;currentChatId=null;
 appScreen.classList.add('hidden');authScreen.classList.remove('hidden');
 showLogin();
}
function showEmpty(){
 welcome.classList.remove('hidden');conversation.classList.add('hidden');
}
function init(){
 const id=localStorage.getItem(SESSION_KEY);
 if(id){
  const user=accounts.find(a=>a.id===id);
  if(user){enterApp(user);return}
 }
}
init();

/* ЧАТЫ */
function userChats(){
 return chats.filter(c=>c.members?.includes(currentUser.id));
}
function getChat(id){return chats.find(c=>c.id===id)}
function otherMember(chat){
 return accounts.find(a=>a.id===chat.members.find(id=>id!==currentUser.id));
}
function chatTitle(chat){
 if(chat.type==='group')return chat.name;
 const other=otherMember(chat);return other?.name||'Неизвестный пользователь';
}
function lastMessage(chat){return chat.messages?.[chat.messages.length-1]}
function renderChats(){
 if(!currentUser)return;
 const query=chatSearch.value.toLowerCase().trim();
 const list=userChats().filter(c=>{
  const name=chatTitle(c).toLowerCase();
  const last=(lastMessage(c)?.text||'').toLowerCase();
  return name.includes(query)||last.includes(query);
 }).sort((a,b)=>(lastMessage(b)?.time||b.created)-(lastMessage(a)?.time||a.created));
 chatList.innerHTML=list.map(c=>{
  const last=lastMessage(c);
  const preview=last?(last.type==='audio'?'🎙 Голосовое сообщение':last.text):'Начните общение';
  const avatar=c.type==='group'?'👥':avatarText(chatTitle(c));
  return `<div class="chat-item ${c.id===currentChatId?'active':''}" onclick="openChat('${c.id}')">
   <div class="avatar">${avatar}</div><div class="chat-info">
   <div class="chat-name">${safe(chatTitle(c))}</div>
   <div class="chat-preview">${safe(preview)}</div></div>
   <div class="chat-time">${last?timeText(last.time):''}</div>
  </div>`;
 }).join('')||'<p class="muted" style="text-align:center;padding:25px">Чатов пока нет</p>';
}
function createDirectChat(user){
 if(user.id===currentUser.id){toast('Это твой аккаунт');return}
 let chat=chats.find(c=>c.type==='direct'&&c.members.includes(currentUser.id)&&c.members.includes(user.id));
 if(!chat){
  chat={id:makeId(),type:'direct',members:[currentUser.id,user.id],messages:[],created:Date.now()};
  chats.push(chat);saveAll();
 }
 renderChats();openChat(chat.id);closeModal();
}
function openChat(id){
 const chat=getChat(id);if(!chat)return;
 currentChatId=id;
 welcome.classList.add('hidden');conversation.classList.remove('hidden');
 appLayout.classList.add('chat-open');
 document.getElementById('headerName').textContent=chatTitle(chat);
 document.getElementById('headerStatus').textContent=chat.type==='group'?'Групповой чат':'MERKS';
 document.getElementById('headerAvatar').textContent=chat.type==='group'?'👥':avatarText(chatTitle(chat));
 renderMessages();renderChats();
}
function closeMobileChat(){appLayout.classList.remove('chat-open')}
function renderMessages(){
 const chat=getChat(currentChatId);if(!chat)return;
 messages.innerHTML=chat.messages.map(m=>{
  const mine=m.sender===currentUser.id;
  const content=m.type==='audio'
   ?`<audio controls src="${m.data}"></audio>`
   :safe(m.text);
  return `<div class="message ${mine?'mine':''}">${content}<small>${mine?'Вы · ':''}${timeText(m.time)}</small></div>`;
 }).join('');
 messages.scrollTop=messages.scrollHeight;
}
function sendMessage(){
 const input=messageInput,text=input.value.trim();
 if(!text||!currentChatId)return;
 const chat=getChat(currentChatId);
 chat.messages.push({id:makeId(),sender:currentUser.id,text,type:'text',time:Date.now()});
 input.value='';saveAll();renderMessages();renderChats();
}
function addEmoji(){
 const emoji=prompt('Введи эмодзи:', '😊');
 if(emoji)messageInput.value+=emoji;
 messageInput.focus();
}

/* ГОЛОСОВЫЕ СООБЩЕНИЯ */
async function toggleRecording(){
 if(!currentChatId){toast('Сначала открой чат');return}
 if(recorder&&recorder.state==='recording'){recorder.stop();return}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){
  toast('Запись не поддерживается этим браузером');return;
 }
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  recordedChunks=[];
  recorder=new MediaRecorder(stream);
  recorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};
  recorder.onstop=()=>{
   const blob=new Blob(recordedChunks,{type:recorder.mimeType||'audio/webm'});
   const reader=new FileReader();
   reader.onload=()=>{
    const chat=getChat(currentChatId);
    if(chat){
     chat.messages.push({id:makeId(),sender:currentUser.id,type:'audio',data:reader.result,time:Date.now()});
     saveAll();renderMessages();renderChats();
    }
   };
   reader.readAsDataURL(blob);
   stream.getTracks().forEach(t=>t.stop());
   recordingLabel.classList.add('hidden');voiceButton.textContent='🎙';
  };
  recorder.start();recordingLabel.classList.remove('hidden');voiceButton.textContent='■';
 }catch(e){toast('Разреши доступ к микрофону')}
}

/* ПОИСК ПОЛЬЗОВАТЕЛЕЙ */
function openSearch(){
 openModal(`<h2>Поиск пользователей</h2>
 <p class="muted">Найди аккаунты, зарегистрированные в этом браузере, по имени или номеру телефона.</p>
 <input class="search-input" id="peopleQuery" placeholder="Имя или номер телефона..." oninput="searchPeople()">
 <div id="peopleResults" style="margin-top:12px"></div>
 <div class="modal-actions"><button class="secondary" onclick="closeModal()">Закрыть</button></div>`);
 searchPeople();
}
function searchPeople(){
 const q=(document.getElementById('peopleQuery')?.value||'').toLowerCase().trim();
 const results=accounts.filter(a=>a.id!==currentUser.id&&(!q||a.name.toLowerCase().includes(q)||a.phone.includes(q)));
 const target=document.getElementById('peopleResults');if(!target)return;
 target.innerHTML=results.map(a=>`<div class="user-result">
 <div class="avatar">${avatarText(a.name)}</div><div class="grow"><b>${safe(a.name)}</b><div class="muted">${safe(a.phone)}</div></div>
 <button class="primary" onclick="createDirectChat(accounts.find(x=>x.id==='${a.id}'))">Написать</button></div>`).join('')||'<p class="muted">Пользователи не найдены.</p>';
}

/* ГРУППЫ */
function openGroupModal(){
 openModal(`<h2>Новая группа</h2>
 <div class="field"><label>Название группы</label><input id="groupName" placeholder="Например, Друзья"></div>
 <p class="muted">Выбери участников. Можно добавить только аккаунты, сохранённые в этом браузере.</p>
 <div id="groupMembers"></div>
 <div class="modal-actions"><button class="secondary" onclick="closeModal()">Отмена</button><button class="primary" onclick="createGroup()">Создать</button></div>`);
 groupMembers.innerHTML=accounts.filter(a=>a.id!==currentUser.id).map(a=>
 `<label style="display:flex;gap:10px;align-items:center;padding:8px 0"><input type="checkbox" value="${a.id}"> ${safe(a.name)} <span class="muted">${safe(a.phone)}</span></label>`
 ).join('')||'<p class="muted">Пока нет других пользователей.</p>';
}
function createGroup(){
 const name=groupName.value.trim();
 if(!name){toast('Введи название группы');return}
 const ids=[...groupMembers.querySelectorAll('input:checked')].map(x=>x.value);
 const chat={id:makeId(),type:'group',name,members:[currentUser.id,...ids],messages:[],created:Date.now()};
 chats.push(chat);saveAll();closeModal();renderChats();openChat(chat.id);
}

/* ПРОФИЛЬ */
function openProfile(){
 openModal(`<div class="profile-center">
 <div class="avatar profile-avatar">${currentUser.avatar?`<img src="${currentUser.avatar}">`:avatarText(currentUser.name)}</div>
 <h2>${safe(currentUser.name)}</h2><p class="muted">${safe(currentUser.phone)}</p></div>
 <div class="field"><label>Имя профиля</label><input id="editName" value="${safe(currentUser.name)}"></div>
 <div class="field"><label>О себе</label><textarea id="editBio" rows="3">${safe(currentUser.bio||'')}</textarea></div>
 <div class="field"><label>Аватар (изображение)</label><input id="avatarFile" type="file" accept="image/*"></div>
 <div class="modal-actions"><button class="secondary" onclick="closeModal()">Закрыть</button><button class="primary" onclick="saveProfile()">Сохранить</button></div>
 <div style="margin-top:15px"><button class="danger-btn full" onclick="logout()">Выйти из аккаунта</button></div>`);
}
function saveProfile(){
 const name=editName.value.trim();if(!name){toast('Имя не может быть пустым');return}
 currentUser.name=name;currentUser.bio=editBio.value.trim();
 const file=avatarFile.files[0];
 const finish=()=>{accounts=accounts.map(a=>a.id===currentUser.id?currentUser:a);saveAll();renderChats();closeModal();toast('Профиль сохранён')};
 if(file){
  if(file.size>700000){toast('Выбери изображение меньше 700 КБ');return}
  const reader=new FileReader();reader.onload=()=>{currentUser.avatar=reader.result;finish()};reader.readAsDataURL(file);
 }else finish();
}
function openCurrentChatProfile(){
 const chat=getChat(currentChatId);if(!chat)return;
 if(chat.type==='group'){
  openModal(`<h2>${safe(chat.name)}</h2><p class="muted">Участники группы</p>${chat.members.map(id=>{const a=accounts.find(x=>x.id===id);return `<p>${safe(a?.name||'Пользователь')} ${id===currentUser.id?'(вы)':''}</p>`}).join('')}<button class="secondary full" onclick="closeModal()">Закрыть</button>`);
 }else{
  const user=otherMember(chat);
  if(!user)return;
  openModal(`<div class="profile-center"><div class="avatar profile-avatar">${user.avatar?`<img src="${user.avatar}">`:avatarText(user.name)}</div><h2>${safe(user.name)}</h2><p class="muted">${safe(user.phone)}</p><p>${safe(user.bio||'')}</p></div><button class="secondary full" onclick="closeModal()">Закрыть</button>`);
 }
}

/* ЗВОНКИ — ДЕМО-ЭКРАН */
function startCall(type){
 if(!currentChatId)return;
 const chat=getChat(currentChatId);
 openModal(`<div class="profile-center">
 <svg class="raven"><use href="#raven-symbol"/></svg>
 <h2>${type==='video'?'Видеозвонок':'Голосовой звонок'}</h2>
 <p class="muted">Вызов: ${safe(chatTitle(chat))}</p>
 <p class="muted">Интерфейс звонков готовится. Для реальных звонков нужно подключить WebRTC и сервер сигнализации.</p>
 </div><div class="modal-actions"><button class="danger-btn" onclick="closeModal()">Завершить</button></div>`);
}

/* МОДАЛЬНЫЕ ОКНА */
function openModal(html){
 modalContent.innerHTML=html;modalBg.classList.remove('hidden');
}
function closeModal(){modalBg.classList.add('hidden');modalContent.innerHTML=''}
</script>
</body>
</html>
