<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080910"><title>MERKS — Вход</title>
<style>
:root{--bg:#080910;--panel:#10121d;--border:#292d40;--text:#f4f5ff;--muted:#9298ad;--accent:#8c75ff;--accent2:#5b48d6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.auth-card{width:min(430px,100%);background:#10121def;border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:0 25px 90px #0009;backdrop-filter:blur(15px)}.brand{text-align:center;margin-bottom:24px}.raven{width:72px;height:72px;margin:auto auto 8px;display:block}.brand h1{letter-spacing:9px;margin:4px 0;font-size:28px}.brand p{color:var(--muted);font-size:13px}.field{margin:14px 0}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.field input{width:100%;padding:14px 15px;background:#090b13;border:1px solid var(--border);border-radius:12px;color:var(--text);outline:none}.field input:focus{border-color:var(--accent)}.primary{border:0;border-radius:12px;padding:13px 17px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white}.full{width:100%}.auth-switch{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}.link{color:#b7aaff;cursor:pointer}.error{color:#ff8294;font-size:12px;min-height:18px;margin-top:8px;line-height:1.4}.hidden{display:none!important}.note{color:var(--muted);font-size:12px;line-height:1.5;text-align:center;margin-top:16px}
</style></head><body><canvas id="stars"></canvas>
<svg width="0" height="0" style="position:absolute"><symbol id="raven-symbol" viewBox="0 0 100 100"><path fill="white" d="M8 15 42 34 57 8 60 34 94 19 73 48 96 54 65 63 84 88 53 72 39 96 39 67 8 79 29 55 5 43 37 44Z"/><path fill="#080910" d="M57 43 91 24 69 49 88 55 60 59Z"/><circle cx="61" cy="43" r="2.7" fill="#080910"/></symbol></svg>
<section class="center"><div class="auth-card"><div class="brand"><svg class="raven"><use href="#raven-symbol"/></svg><h1>MERKS</h1><p>Твоя связь. Твои правила.</p></div>
<div id="loginForm"><h2>С возвращением</h2><div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Пароль</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Твой пароль"></div><div id="loginError" class="error"></div><button id="loginBtn" class="primary full">Войти в MERKS</button><div class="auth-switch">Нет аккаунта? <span class="link" id="toRegister">Создать аккаунт</span></div></div>
<div id="registerForm" class="hidden"><h2>Создать аккаунт</h2><div class="field"><label>Имя профиля</label><input id="regName" maxlength="40" placeholder="Как тебя называть" autocomplete="name"></div><div class="field"><label>Email</label><input id="regEmail" type="email" autocomplete="email" placeholder="you@example.com"></div><div class="field"><label>Пароль</label><input id="regPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Минимум 6 символов"></div><div class="field"><label>Повтори пароль</label><input id="regPassword2" type="password" minlength="6" autocomplete="new-password" placeholder="Повтори пароль"></div><div id="registerError" class="error"></div><button id="registerBtn" class="primary full">Зарегистрироваться</button><div class="auth-switch">Уже есть аккаунт? <span class="link" id="toLogin">Войти</span></div></div>
<p class="note">MERKS BETA · Данные аккаунта и переписки хранятся в Supabase.</p></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://vjkvyoghxfkhdadpzxel.supabase.co';
const SUPABASE_KEY='sb_publishable_d1XsFCATC2zPdrbW_eITTQ_3Zp5XS7t';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);const SITE_URL='https://youkku-u.github.io/merks/';
function show(which){$('loginForm').classList.toggle('hidden',which!=='login');$('registerForm').classList.toggle('hidden',which!=='register');$('loginError').textContent='';$('registerError').textContent=''}
$('toRegister').onclick=()=>show('register');$('toLogin').onclick=()=>show('login');
function errText(e){return e?.message||'Что-то пошло не так. Попробуй ещё раз.'}
function busy(btn,on,label){btn.disabled=on;btn.textContent=on?'Подожди...':label}
$('registerBtn').onclick=async()=>{const btn=$('registerBtn'),name=$('regName').value.trim(),email=$('regEmail').value.trim(),password=$('regPassword').value,password2=$('regPassword2').value;$('registerError').textContent='';if(!name||!email||!password){$('registerError').textContent='Заполни все поля.';return}if(password.length<6){$('registerError').textContent='Пароль должен содержать минимум 6 символов.';return}if(password!==password2){$('registerError').textContent='Пароли не совпадают.';return}busy(btn,true,'Зарегистрироваться');try{const {data,error}=await db.auth.signUp({email,password,options:{data:{display_name:name},emailRedirectTo:SITE_URL}});if(error)throw error;if(data.session){location.href='app.html'}else{$('registerError').style.color='#9de4bd';$('registerError').textContent='Аккаунт создан! Проверь почту и подтверди email, затем войди.';show('login');$('loginEmail').value=email;$('loginError').style.color='#9de4bd';$('loginError').textContent='Проверь почту для подтверждения регистрации.'}}catch(e){$('registerError').textContent=errText(e)}finally{busy(btn,false,'Зарегистрироваться')}};
$('loginBtn').onclick=async()=>{const btn=$('loginBtn'),email=$('loginEmail').value.trim(),password=$('loginPassword').value;$('loginError').textContent='';if(!email||!password){$('loginError').textContent='Введи email и пароль.';return}busy(btn,true,'Войти в MERKS');try{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;location.href='app.html'}catch(e){$('loginError').textContent=errText(e)}finally{busy(btn,false,'Войти в MERKS')}};
$('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('regPassword2').addEventListener('keydown',e=>{if(e.key==='Enter')$('registerBtn').click()});
(async()=>{const {data}=await db.auth.getSession();if(data.session)location.replace('app.html')})();
const canvas=$('stars'),ctx=canvas.getContext('2d');let stars=[];function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);stars=Array.from({length:150},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.3,a:Math.random(),s:Math.random()*.012+.002}))}function animate(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const s of stars){s.a+=s.s;if(s.a>1||s.a<.15)s.s*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='white';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(animate)}addEventListener('resize',resize);resize();animate();
</script></body></html>
