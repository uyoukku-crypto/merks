const SUPABASE_URL='https://vjkvyoghxfkhdadpzxel.supabase.co';const SUPABASE_KEY='sb_publishable_d1XsFCATC2zPdrbW_eITTQ_3Zp5XS7t';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let me=null,profile=null,chats=[],active=null,messagesChannel=null,recorder=null,recordingStream=null,recorded=[];let signedAudio=new Map();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function initials(s){return(s||'?').trim().slice(0,1).toUpperCase()}function time(t){return new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2800)}function fail(e){console.error(e);toast(e?.message||'Произошла ошибка')}function title(c){if(c.type==='group')return c.title||'Группа';const other=(c.members||[]).find(x=>x.user_id!==me.id)?.profile;return other?.display_name||other?.username||'Пользователь'}function last(c){return c.last_message||'Начните общение'}
async function loadProfile(){const {data,error}=await db.from('profiles').select('*').eq('id',me.id).single();if(error)throw error;profile=data}
async function loadChats(){const {data:mine,error}=await db.from('conversation_members').select('conversation_id').eq('user_id',me.id);if(error)throw error;const ids=(mine||[]).map(x=>x.conversation_id);if(!ids.length){chats=[];renderChats();return}const {data:cs,error:e}=await db.from('conversations').select('*').in('id',ids).order('created_at',{ascending:false});if(e)throw e;const {data:members,error:meErr}=await db.from('conversation_members').select('conversation_id,user_id').in('conversation_id',ids);if(meErr)throw meErr;const userIds=[...new Set((members||[]).map(m=>m.user_id))];const {data:profiles,error:pErr}=await db.from('profiles').select('id,username,display_name,avatar_url,bio').in('id',userIds);if(pErr)throw pErr;const profileMap=new Map((profiles||[]).map(p=>[p.id,p]));chats=(cs||[]).map(c=>({...c,members:(members||[]).filter(m=>m.conversation_id===c.id).map(m=>({...m,profile:profileMap.get(m.user_id)}))}));for(const c of chats){const {data:m}=await db.from('messages').select('content,voice_url,created_at').eq('conversation_id',c.id).order('created_at',{ascending:false}).limit(1);c.last_message=m?.[0]?(m[0].voice_url?'🎙 Голосовое сообщение':m[0].content||'Вложение'):'Начните общение';c.last_time=m?.[0]?.created_at||c.created_at}chats.sort((a,b)=>new Date(b.last_time)-new Date(a.last_time));renderChats()}
function renderChats(){const q=$('search').value.toLowerCase().trim();const list=chats.filter(c=>(title(c)+' '+last(c)).toLowerCase().includes(q));$('chatList').innerHTML=list.map(c=>`<div class="chat ${active===c.id?'active':''}" data-id="${c.id}"><div class="avatar">${c.type==='group'?'👥':esc(initials(title(c)))}</div><div class="chatinfo"><div class="chatline"><strong>${esc(title(c))}</strong><time>${c.last_time?time(c.last_time):''}</time></div><div class="preview">${esc(last(c))}</div></div></div>`).join('')||'<div class="empty" style="padding:25px;text-align:center">Чатов пока нет</div>';document.querySelectorAll('.chat[data-id]').forEach(el=>el.onclick=()=>openChat(el.dataset.id))}
async function openChat(id){active=id;const c=chats.find(x=>x.id===id);if(!c)return;$('welcome').classList.add('hidden');$('conversation').classList.remove('hidden');$('shell').classList.add('inchat');$('headName').textContent=title(c);$('headAvatar').textContent=c.type==='group'?'👥':initials(title(c));$('headStatus').textContent=c.type==='group'?'Групповой чат':'MERKS';renderChats();await loadMessages();subscribeMessages()}
async function loadMessages(){const {data,error}=await db.from('messages').select('*').eq('conversation_id',active).order('created_at',{ascending:true}).limit(300);if(error)throw error;const rows=data||[];for(const m of rows){if(m.voice_url&&!signedAudio.has(m.voice_url)){const {data:d}=await db.storage.from('voice-messages').createSignedUrl(m.voice_url,3600);if(d?.signedUrl)signedAudio.set(m.voice_url,d.signedUrl)}}renderMessages(rows)}
function renderMessages(rows){$('messages').innerHTML=rows.map(m=>{const mine=m.sender_id===me.id;const content=m.voice_url?(signedAudio.get(m.voice_url)?`<audio controls preload="metadata" src="${esc(signedAudio.get(m.voice_url))}"></audio>`:'<span class="hint">Голосовое загружается…</span>'):esc(m.content||'');return `<div class="bubble ${mine?'mine':''}">${content}<time>${mine?'Вы · ':''}${time(m.created_at)}</time></div>`}).join('')||'<div class="empty">Пока нет сообщений. Напиши первым!</div>';$('messages').scrollTop=$('messages').scrollHeight}
function subscribeMessages(){if(messagesChannel)db.removeChannel(messagesChannel);messagesChannel=db.channel('messages-'+active).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+active},()=>loadMessages().catch(fail)).subscribe()}
async function send(){const text=$('messageInput').value.trim();if(!text||!active)return;$('send').disabled=true;try{const {error}=await db.from('messages').insert({conversation_id:active,sender_id:me.id,content:text});if(error)throw error;$('messageInput').value='';await loadMessages();await loadChats()}catch(e){fail(e)}finally{$('send').disabled=false}}
$('send').onclick=send;$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter')send()});$('search').oninput=renderChats;$('back').onclick=()=>{$('shell').classList.remove('inchat');active=null;$('conversation').classList.add('hidden');$('welcome').classList.remove('hidden');renderChats();if(messagesChannel){db.removeChannel(messagesChannel);messagesChannel=null}};
function showModal(html){$('modal').innerHTML=html;$('overlay').classList.add('show')}function closeModal(){$('overlay').classList.remove('show')}$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};
async function findPeople(){showModal(`<h3>Найти людей</h3><input id="peopleSearch" placeholder="Имя или @username"><div class="people" id="people"><p class="hint">Введи имя или username для поиска.</p></div><div class="modal-actions"><button class="btn" id="close">Закрыть</button></div>`);$('close').onclick=closeModal;$('peopleSearch').oninput=async()=>{const q=$('peopleSearch').value.trim();if(q.length<2){$('people').innerHTML='<p class="hint">Введи минимум 2 символа.</p>';return}const {data,error}=await db.from('profiles').select('id,username,display_name,bio').neq('id',me.id).or(`display_name.ilike.%${q}%,username.ilike.%${q}%`).limit(20);if(error){$('people').textContent=error.message;return}$('people').innerHTML=(data||[]).map(u=>`<div class="person"><div class="avatar">${esc(initials(u.display_name||u.username))}</div><span><b>${esc(u.display_name||u.username||'Пользователь')}</b><small class="hint" style="display:block">${u.username?'@'+esc(u.username):''}</small></span><button class="btn" data-user="${u.id}">Чат</button></div>`).join('')||'<p class="hint">Никого не нашли.</p>';document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>createDirect(b.dataset.user))}}
$('findPeople').onclick=findPeople;
async function createDirect(userId){try{const existing=chats.find(c=>c.type==='direct'&&c.members.length===2&&c.members.some(m=>m.user_id===userId));if(existing){closeModal();openChat(existing.id);return}const {data:c,error}=await db.from('conversations').insert({type:'direct',created_by:me.id}).select().single();if(error)throw error;const {error:meErr}=await db.from('conversation_members').insert([{conversation_id:c.id,user_id:me.id},{conversation_id:c.id,user_id:userId}]);if(meErr)throw meErr;closeModal();await loadChats();await openChat(c.id)}catch(e){fail(e)}}
async function newGroup(){showModal(`<h3>Новая группа</h3><input id="groupName" maxlength="80" placeholder="Название группы"><input id="groupSearch" placeholder="Найти участников"><div class="people" id="groupPeople"></div><div class="modal-actions"><button class="btn" id="cancel">Отмена</button><button class="btn primary" id="create">Создать</button></div>`);let people=[];let selected=new Set();$('cancel').onclick=closeModal;$('groupSearch').oninput=async()=>{const q=$('groupSearch').value.trim();if(q.length<2){$('groupPeople').innerHTML='';return}const {data,error}=await db.from('profiles').select('id,username,display_name').neq('id',me.id).or(`display_name.ilike.%${q}%,username.ilike.%${q}%`).limit(30);if(error){fail(error);return}people=data||[];$('groupPeople').innerHTML=people.map(u=>`<label class="person"><input type="checkbox" value="${u.id}" ${selected.has(u.id)?'checked':''}><span>${esc(u.display_name||u.username||'Пользователь')}</span></label>`).join('');$('groupPeople').querySelectorAll('input').forEach(ch=>ch.onchange=()=>ch.checked?selected.add(ch.value):selected.delete(ch.value))};$('create').onclick=async()=>{const name=$('groupName').value.trim();if(!name){toast('Введи название группы');return}try{const {data:c,error}=await db.from('conversations').insert({type:'group',title:name,created_by:me.id}).select().single();if(error)throw error;const rows=[me.id,...selected].map(user_id=>({conversation_id:c.id,user_id}));const {error:e}=await db.from('conversation_members').insert(rows);if(e)throw e;closeModal();await loadChats();openChat(c.id)}catch(e){fail(e)}}}
$('newGroup').onclick=newGroup;
async function myProfile(){showModal(`<h3>Мой профиль</h3><label class="hint">Имя</label><input id="pName" maxlength="40" value="${esc(profile.display_name||'')}"><label class="hint">Username</label><input id="pUser" maxlength="24" value="${esc(profile.username||'')}" placeholder="например raven_01"><label class="hint">О себе</label><textarea id="pBio" maxlength="300">${esc(profile.bio||'')}</textarea><div class="modal-actions"><button class="btn" id="cancel">Отмена</button><button class="btn primary" id="save">Сохранить</button></div>`);$('cancel').onclick=closeModal;$('save').onclick=async()=>{const username=$('pUser').value.trim().replace(/^@/,'').toLowerCase();if(username&&!/^[a-z0-9_]{3,24}$/.test(username)){toast('Username: 3–24 символа, латиница, цифры и _');return}try{const {data,error}=await db.from('profiles').update({display_name:$('pName').value.trim(),username:username||null,bio:$('pBio').value.trim()}).eq('id',me.id).select().single();if(error)throw error;profile=data;closeModal();toast('Профиль сохранён')}catch(e){fail(e)}}}

function settings(){showModal(`<h3>Настройки MERKS</h3><div class="setting-row"><span>Аккаунт</span><span class="hint">${esc(me.email||'')}</span></div><p class="hint">Это beta-версия. Переписки доступны участникам чатов. Для защиты аккаунта не передавай никому пароль.</p><div class="modal-actions"><button class="btn" id="logout">Выйти из аккаунта</button><button class="btn primary" id="done">Готово</button></div>`);$('done').onclick=closeModal;$('logout').onclick=async()=>{await db.auth.signOut();location.href='index.html'}}$('settings').onclick=settings;
async function chatInfo(){const c=chats.find(x=>x.id===active);if(!c)return;showModal(`<h3>${esc(title(c))}</h3><p class="hint">${c.type==='group'?'Групповой чат':'Личная переписка'}</p><p>Участников: ${c.members.length}</p><div class="people">${c.members.map(m=>`<div class="person"><div class="avatar">${esc(initials(m.profile?.display_name||m.profile?.username))}</div><span>${esc(m.profile?.display_name||m.profile?.username||'Пользователь')}${m.user_id===me.id?' · вы':''}</span></div>`).join('')}</div><div class="modal-actions"><button class="btn primary" id="done">Закрыть</button></div>`);$('done').onclick=closeModal}$('chatInfo').onclick=chatInfo;
function callScreen(kind){const c=chats.find(x=>x.id===active);if(!c)return;showModal(`<div class="callbox"><div class="avatar">${c.type==='group'?'👥':esc(initials(title(c)))}</div><h3>${kind==='audio'?'Голосовой звонок':'Видеозвонок'}</h3><p class="hint">Экран звонка MERKS</p><p class="hint">В этой beta-версии настоящая передача звука и видео ещё не подключена. Для реальных звонков потребуется WebRTC и сервер сигнализации.</p><button class="btn primary" id="end">Закрыть</button></div>`);$('end').onclick=closeModal}$('voiceCall').onclick=()=>callScreen('audio');$('videoCall').onclick=()=>callScreen('video');
async function toggleRecord(){if(!active)return toast('Сначала открой чат');if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder)return toast('Запись недоступна в этом браузере');try{recordingStream=await navigator.mediaDevices.getUserMedia({audio:true});recorded=[];recorder=new MediaRecorder(recordingStream);recorder.ondataavailable=e=>{if(e.data.size)recorded.push(e.data)};recorder.onstop=async()=>{ $('recordingLabel').classList.add('hidden');$('record').textContent='🎙';recordingStream?.getTracks().forEach(t=>t.stop());try{const blob=new Blob(recorded,{type:recorder.mimeType||'audio/webm'});if(!blob.size)return;const ext=blob.type.includes('ogg')?'ogg':blob.type.includes('mp4')?'mp4':'webm';const path=`${active}/${me.id}/${crypto.randomUUID()}.${ext}`;const {error}=await db.storage.from('voice-messages').upload(path,blob,{contentType:blob.type,upsert:false});if(error)throw error;const {error:e}=await db.from('messages').insert({conversation_id:active,sender_id:me.id,voice_url:path});if(e)throw e;await loadMessages();await loadChats();toast('Голосовое отправлено')}catch(e){fail(e)}};recorder.start();$('record').textContent='■';$('recordingLabel').classList.remove('hidden')}catch(e){toast('Не удалось получить доступ к микрофону: '+e.message)}}$('record').onclick=toggleRecord;
async function init(){const {data,error}=await db.auth.getSession();if(error||!data.session){location.replace('index.html');return}me=data.session.user;try{await loadProfile();await loadChats()}catch(e){fail(e)}db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'||!session)location.replace('index.html')})}
const canvas=$('stars'),ctx=canvas.getContext('2d');let stars=[];function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);stars=Array.from({length:140},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+.3,a:Math.random(),s:Math.random()*.012+.002}))}function animate(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const s of stars){s.a+=s.s;if(s.a>1||s.a<.15)s.s*=-1;ctx.globalAlpha=s.a;ctx.fillStyle='white';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(animate)}addEventListener('resize',resize);resize();animate();init();
